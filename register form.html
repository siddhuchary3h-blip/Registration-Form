<!DOCTYPE html>
<html lang="en">
<head>
    <title>Registration Form</title>
</head>
<body style="background-color: rgb(194, 156, 175);">
    <caption>
        <center><h1>Registration Form</h1></center>
    </caption>
    <center>
    <table style="border: 1px solid rgb(251, 248, 248); font-color:rgb(250,340,320);font-bold: 500; font-size: 20px; background-color: rgb(255, 255, 255);">
        <style>
                td {
                    padding: 10px;
                }
            </style>
        <tr>
            <td>First Name:</td>
            <td><input type="text" placeholder="name" style="background-color: rgb(166, 233, 23);"></td>
        </tr>
        <tr>
            <td>password</td>
            <td>  <input type="password" placeholder="password" style="background-color: rgb(166, 233, 23);"></td>
        </tr>
        <tr>
            <td> Date of Birth
                </td>
            <td>
            <input type="date" placeholder="Date of Birth" style="background-color: rgb(166, 233, 23);">
        </td>
        </tr>
        <tr>
            <td>Email</td>
            <td> <input type="email" placeholder="email" style="background-color: rgb(166, 233, 23);"></td>
        </tr> 
        <tr>
            <td>
                Gender:
            </td>
            <td>
                <label for="male">Male</label>
                <input type="radio" id="male" name="gender" value="male">
                <label for="female">Female</label>
                <input type="radio" id="female" name="gender" value="female">
            </td>
        </tr>
        <tr>
            <td> 
                phone num:
             <select>
                    <option value="+91">+91</option>
                    <option value="+92">+92</option>
                    <option value="+93">+93</option>
                    <option value="+94">+94</option>
                    <option value="+95">+95</option>
             </select>
            </td>
            <td>
            <input type="text" placeholder="phone" style="background-color: rgb(166, 233, 23);">
            </td>
        </tr>
        <tr>
            <th colspan="2">
                <a href="boiler.html"> <input type="submit" value="Submit"> </a>
            </th>
            
        </tr>
        
    </table>
    </center>
    <center>
    <code>
        <h3>Registration Form</h3>
        <p>This is a simple registration form created using HTML. It includes fields for first name, password, date of birth, email
    </code>
</center>
    
    
</body>
</html>
